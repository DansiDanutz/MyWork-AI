name: SBOM Generation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CycloneDX tool
        run: |
          pip install cyclonedx-bom

      - name: Install MyWork-AI dependencies
        run: |
          pip install -e .
          pip install -e ".[api,dev]"

      - name: Generate SBOM (Python)
        run: |
          cyclonedx-py --format json --output sbom-python.json -i .

      - name: Generate SBOM (SPDX)
        run: |
          pip install install-py-project
          pip install pip-audit
          pip-audit --format spdx-json --output sbom-spdx.json || true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-*.json
          retention-days: 90

      - name: Attach SBOM to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom-*.json

  sbom-attestation:
    name: SBOM Attestation
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-artifacts

      - name: Generate checksums
        run: |
          sha256sum sbom-*.json > sbom-checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: sbom-checksums
          path: sbom-checksums.txt
          retention-days: 90
