name: P4.3 Secret Presence Probe
on:
  push:
    branches: [main]
    paths-ignore:
      - P4_SECRET_PRESENCE.json
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Record safe secret presence only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('P4_SECRET_PRESENCE.json',JSON.stringify({openai_api_key_configured:Boolean(process.env.OPENAI_API_KEY),vercel_token_configured:Boolean(process.env.VERCEL_TOKEN),vercel_org_id_configured:Boolean(process.env.VERCEL_ORG_ID),vercel_project_id_configured:Boolean(process.env.VERCEL_PROJECT_ID),plaintext_exposed:false,checked_at:new Date().toISOString()},null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add P4_SECRET_PRESENCE.json
          git commit -m 'P4.3 record secret presence only' || true
          git push
