name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."

          # Check for common API key patterns (exclude docs/config that may have placeholders)
          if grep -rE "(sk-ant-|sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|gsk_[a-zA-Z0-9]+)" \
            --include="*.py" --include="*.js" --include="*.ts" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=.openclaw --exclude="*example*" --exclude="*test*" . 2>/dev/null; then
            echo "WARNING: Potential API keys found in code!"
            exit 1
          fi

          # Check for .env files that shouldn't be committed
          if find . -name ".env" -not -name ".env.example" | grep -q .; then
            echo "WARNING: .env file found in repository!"
            exit 1
          fi

          echo "No secrets detected."

  dependency-scan:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check for known vulnerabilities
        run: |
          python -m pip install --upgrade 'setuptools>=83'
          pip install -e . pip-audit
          pip-audit

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: |
          pip install ruff bandit

      - name: Block Python syntax and undefined-name defects
        run: ruff check tools/ --select=E9,F63,F7,F82

      - name: Block medium and high findings in exposed control surfaces
        run: bandit -r tools/agent.py projects/ai-dashboard/backend -ll

  gitignore-check:
    name: Gitignore Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify sensitive files not tracked
        run: |
          echo "Checking that sensitive files are not tracked..."

          SENSITIVE_PATTERNS=(
            "^\.mcp\.json$"
            "brain_data\.json$"
            "module_registry\.json$"
            "\.pem$"
            "\.key$"
            "^credentials\.json$"
          )

          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            if git ls-files | grep -qE "$pattern"; then
              echo "ERROR: Sensitive file pattern '$pattern' found in git!"
              exit 1
            fi
          done

          # Check for .env files (exclude .env.example and .env.production)
          if git ls-files | grep '\.env$' | grep -v '\.env\.example$' | grep -v '\.env\.production$' | grep -q .; then
            echo "ERROR: .env file found in git!"
            exit 1
          fi

          echo "All sensitive patterns properly ignored."
