name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          pip install -e '.[dev,api,agent]'

      - name: Lint
        run: ruff check tools/ --select=E9,F63,F7,F82

      - name: Test
        run: pytest tests/ -v --timeout=60

      - name: Verify CLI
        run: |
          mw version
          mw status
          mw templates
          mw selftest || true

  ai-dashboard-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-dashboard/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/ai-dashboard/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build with type checks
        run: npm run build
